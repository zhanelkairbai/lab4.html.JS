<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заявка на стажировку</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Заявка на стажировку</h1>

    <form id="internshipForm">

        <label for="name">ФИО:</label>
        <input type="text" id="name" placeholder="Введите ФИО">

        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="Введите e-mail">

        <br><br>

        <label for="course">Курс:</label>
        <select id="course">
            <option value="">Выберите курс</option>
            <option value="1 курс">1 курс</option>
            <option value="2 курс">2 курс</option>
            <option value="3 курс">3 курс</option>
            <option value="4 курс">4 курс</option>
        </select>

        <br><br>

        <label for="direction">Направление:</label>
        <select id="direction">
            <option value="">Выберите направление</option>
            <option value="Программирование">Программирование</option>
            <option value="Дизайн">Дизайн</option>
            <option value="Маркетинг">Маркетинг</option>
            <option value="Аналитика">Аналитика</option>
        </select>

        <br><br>

        <p>Ваши навыки:</p>

        <label>
            <input type="checkbox" name="skill" value="HTML">
            HTML
        </label>

        <br>

        <label>
            <input type="checkbox" name="skill" value="CSS">
            CSS
        </label>

        <br>

        <label>
            <input type="checkbox" name="skill" value="JavaScript">
            JavaScript
        </label>

        <br>

        <label>
            <input type="checkbox" name="skill" value="Python">
            Python
        </label>

        <br><br>

        <label for="motivation">Мотивационный текст:</label>
        <br>
        <textarea
            id="motivation"
            placeholder="Напишите, почему вы хотите пройти стажировку"
            rows="6"
            cols="40"
        ></textarea>

        <br><br>

        <button type="submit">Отправить заявку</button>

    </form>

    <p id="message"></p>

    <script src="script.js"></script>

</body>
</html>
